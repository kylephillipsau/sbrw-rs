name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run from the Actions tab to include macOS, which costs 10x the minutes of
  # Linux on a private repo and so is left out of push and pull_request runs.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Port markers name real upstream units
        run: python3 tools/port.py check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sbrw-rs:ci
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}
      - name: Smoke test
        run: |
          docker run -d --name sbrw -p 8680:8680 sbrw-rs:ci
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8680/Engine.svc/GetServerInformation && break
            sleep 1
          done
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8680/Engine.svc/anything)" = 200
          docker exec sbrw /usr/local/bin/sbrw healthcheck
          docker logs sbrw
