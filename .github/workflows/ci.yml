name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run from the Actions tab to include macOS, which push and pull_request
  # runs leave out.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Port markers name real upstream units
        run: python3 tools/port.py check
      - name: Generated sources match their recorded inputs
        run: |
          python3 tools/gen.py tlds
          python3 tools/gen.py routes
          python3 tools/gen.py dtos
          git diff --exit-code

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Name the commit for the image's log
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            SBRW_GIT_COMMIT=${{ steps.commit.outputs.short }}
            SBRW_GIT_COMMIT_LONG=${{ github.sha }}
          tags: sbrw-rs:ci
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}
      - name: Smoke test
        run: |
          docker run -d --name sbrw -p 8680:8680 sbrw-rs:ci
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8680/health && break
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:8680/Engine.svc/GetServerInformation
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8680/Engine.svc/anything)" = 200
          docker exec sbrw /usr/local/bin/sbrw healthcheck
          # The operator CLI reaches the server inside the container, and
          # nothing outside it reaches the operator API.
          docker exec sbrw /usr/local/bin/sbrw admin tokens | grep -q '^ADMIN_AUTH = [0-9a-f]\{32\}$'
          docker exec sbrw /usr/local/bin/sbrw admin backup | grep -q '^Backed up to /data/backups/'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8680/admin/tokens)" = 404
          # The log names the commit and is kept in the data volume too.
          docker cp sbrw:/data/logs ./logs
          grep -q "starting commit=\"${GITHUB_SHA::7}\"" logs/sbrw.*.log
          docker logs sbrw
      # Pushes to main publish each platform's image by digest; `publish`
      # below joins them under one tag.
      - name: Log in to the GitHub container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SBRW_GIT_COMMIT=${{ steps.commit.outputs.short }}
            SBRW_GIT_COMMIT_LONG=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.runner }}
      - name: Keep the digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          retention-days: 1

  publish:
    needs: [test, deny, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both platforms as one image
        working-directory: digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "$image:main" -t "$image:sha-${GITHUB_SHA::7}" \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:main"
