[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
sbrw-common = { path = "crates/sbrw-common" }
sbrw-core = { path = "crates/sbrw-core" }
sbrw-http = { path = "crates/sbrw-http" }
sbrw-java = { path = "crates/sbrw-java" }
sbrw-script = { path = "crates/sbrw-script" }
sbrw-testkit = { path = "crates/sbrw-testkit" }
sbrw-udp = { path = "crates/sbrw-udp" }
sbrw-xml = { path = "crates/sbrw-xml" }
sbrw-xmpp = { path = "crates/sbrw-xmpp" }

anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
form_urlencoded = "1.2.2"
hex = "0.4.3"
http-body-util = "0.1.5"
idna = "1.1.0"
indexmap = { version = "2.14.2", features = ["serde"] }
libtest-mimic = "0.8.2"
openssl = { version = "0.10.81", features = ["vendored"] }
quick-xml = "0.42.0"
regex = "1.13.1"
rquickjs = "0.14.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-openssl = "0.6.5"
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.9"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "decompression-gzip", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Hashing and SQLite are slow unoptimised, and every test boots a world.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
