reason = "Logs the core in to Openfire as sbrw.engine.engine to send pushes. sbrw-rs runs its own XMPP server, so the core talks to its hub in process instead of to Openfire over the network. Pushes go to the hub over a channel (Openfire::outbound)."

["xmpp/OpenFireConnector#send(String,Long)"]
status = "replaced"
reason = "Sends a push as a message from the engine's XMPP session. sbrw-rs runs its own XMPP server, so the core talks to its hub in process instead of to Openfire over the network. OpenFireSoapBoxCli.send's port hands it to the hub."

["xmpp/OpenFireConnector#getX509TrustManager()"]
status = "replaced"
reason = "Trusts any certificate on the core's connection to Openfire. sbrw-rs runs its own XMPP server, so the core talks to its hub in process instead of to Openfire over the network."

["xmpp/OpenFireConnector#getConnectionConfiguration()"]
