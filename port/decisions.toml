reason = "Creates a public chat room channel.<language>__<n> in Openfire, for each chat_room row at startup. sbrw-rs runs its own XMPP server, so the core talks to its hub in process instead of to Openfire over the network. sbrw serve creates them in the hub from the same rows (Hub::create_public_room)."
