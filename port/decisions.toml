# Units of soapbox-race-core that sbrw-rs deliberately does not port 1:1.
# Keys are unit ids from port/inventory.json. `status` is "replaced" (the
# behaviour exists, implemented differently) or "dropped" (not reproduced).
# Everything else must be ported and carry a `// port: <unit id>` marker.

["bo/StartupBO#init()"]
status = "dropped"
reason = """
Inserts the online-stats row a second time at boot, colliding with OnlineUsersBO's
own @PostConstruct insert in the same second; real servers only survive by cold-start
timing. The startup log line is the only other effect. sbrw-rs inserts the row once."""

["bo/RedisBO#init()"]
status = "replaced"
reason = """
Connects to a Redis server when ENABLE_REDIS is true. One process needs no server:
sbrw_core::redis keeps the same keys and commands in memory, created at boot under
the same switch."""

["bo/RedisBO#getConnection()"]
status = "replaced"
reason = "Hands the shared connection to MatchmakingBO and PresenceBO; they use World.redis instead."

["bo/RedisBO#createPubSub()"]
status = "replaced"
reason = """
A publish connection for PresenceBO's game_presence_updates channel, which nothing in
the stack subscribes to. sbrw_core::redis::Redis::publish only records the publish."""

["bo/RedisBO#getRedisClient()"]
status = "dropped"
reason = "Unused upstream: nothing calls it."

["bo/MatchmakingBO#shutdown()"]
status = "dropped"
reason = """
@PreDestroy clearing the queue from an external Redis that outlives the server. The
in-memory queue dies with the process."""

["bo/PresenceBO#shutdown()"]
status = "dropped"
reason = """
@PreDestroy clearing presence keys from an external Redis that outlives the server and
closing the pub/sub connection. In-memory presence dies with the process."""

["api/util/BuildInfo#getGitPropertiesStream()"]
status = "replaced"
reason = """
Upstream reads its branch, commit and build time from a git.properties resource built
into the war, reporting "unknown" when it is missing (as in the reference rig).
sbrw_core::BuildInfo takes the same values from SBRW_GIT_* variables at compile time,
and the replay harness uses BuildInfo::unknown() to match the recordings."""

["bo/RequestSessionInfo#getTokenSessionEntity()"]
status = "replaced"
reason = """
The request-scoped holder of the session AuthenticationFilter validated. sbrw-http's
Call::session() is that session; handlers read its fields directly."""

["bo/RequestSessionInfo#setTokenSessionEntity(TokenSessionEntity)"]
status = "replaced"
reason = "Set by AuthenticationFilter; sbrw-http's dispatch stores the session in the Call."

["bo/RequestSessionInfo#getUser()"]
status = "replaced"
reason = "Call::session().user, the session's copy of the user."

["bo/RequestSessionInfo#isAdmin()"]
status = "replaced"
reason = "Call::session().user.is_admin."

["bo/RequestSessionInfo#getEventSessionId()"]
status = "replaced"
reason = "Call::session().event_session_id."

["bo/RequestSessionInfo#getActiveLobbyId()"]
status = "replaced"
reason = "Call::session().active_lobby_id."

["bo/RequestSessionInfo#getActivePersonaId()"]
status = "replaced"
reason = "Call::session().active_persona_id."

["bo/RequestSessionInfo#getRelayCryptoTicket()"]
status = "replaced"
reason = "Call::session().relay_crypto_ticket."

["dao/LobbyEntrantDAO#deleteByPersona(PersonaEntity)"]
status = "dropped"
reason = "Unused upstream: nothing calls it."

["jpa/LobbyEntrantEntity@LobbyEntrantEntity.deleteByPersona"]
status = "dropped"
reason = "Only LobbyEntrantDAO.deleteByPersona runs it, and nothing calls that."

["jpa/LobbyEntity@LobbyEntity.findAllOpen"]
status = "dropped"
reason = "Unused upstream: LobbyDAO.findAllOpen runs LobbyEntity.findAllOpenByCarClass."

["jpa/LobbyEntrantEntity#compareTo(LobbyEntrantEntity)"]
status = "dropped"
reason = """
Unused upstream: nothing sorts entrants by their natural order. LobbyCountdownBO.onTimeout
sorts with its own comparator, by persona id highest first."""

["bo/SocialRelationshipBO#init()"]
status = "dropped"
reason = "@PostConstruct that only logs that the social system started."

["bo/SocialRelationshipBO#shutdown()"]
status = "dropped"
reason = "@PreDestroy that only logs that the social system stopped."

["dao/SocialRelationshipDAO#deleteAllByPersonaId(Long)"]
status = "dropped"
reason = """
Unused upstream: nothing calls it. Deleting a driver removes the rows naming it through
the foreign key's ON DELETE CASCADE, in MySQL as in SQLite."""

["jpa/SocialRelationshipEntity@SocialRelationshipEntity.deleteAllByPersonaId"]
status = "dropped"
reason = "Only SocialRelationshipDAO.deleteAllByPersonaId runs it, and nothing calls that."

["dao/PersonaBadgeDAO#deleteAllBadgesForPersona(Long)"]
status = "dropped"
reason = "Unused upstream: nothing calls it. A deleted driver's badges go through ON DELETE CASCADE."

["jpa/PersonaBadgeEntity@PersonaBadgeEntity.deleteAllBadgesForPersona"]
status = "dropped"
reason = "Only PersonaBadgeDAO.deleteAllBadgesForPersona runs it, and nothing calls that."
